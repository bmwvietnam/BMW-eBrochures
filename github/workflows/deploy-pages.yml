name: Deploy BMW E-Brochure (self-hosted PDF.js)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Mozilla PDF.js (build time only)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build static website and local PDF.js resources
        run: npm run build
      - name: Verify no PDF.js CDN URLs and all resources exist
        run: npm run verify
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
